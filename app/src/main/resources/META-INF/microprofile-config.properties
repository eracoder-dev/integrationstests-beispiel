# MicroProfile Config. Umgebungsvariablen und Systemeigenschaften haben Vorrang vor dieser Datei,
# ADRESSDIENST_URL überschreibt also adressdienst.url.
adressdienst.url=http://localhost:8089
adressdienst.verbindungs-timeout-ms=500
adressdienst.lese-timeout-ms=1500

# Externe SOAP-Schnittstelle "Bonitätsauskunft"
bonitaetsdienst.url=http://localhost:8089/soap/bonitaet
bonitaetsdienst.verbindungs-timeout-ms=1000
bonitaetsdienst.lese-timeout-ms=1500

# Anträge bis zu dieser Summe werden bei gültiger Adresse automatisch angenommen.
antrag.automatik.grenze=300000

# Fault Tolerance ohne Neubau ändern: <Klasse>/<Methode>/<Annotation>/<Parameter>
de.beispiel.antragsbearbeitung.service.Adresspruefung/pruefe/Retry/maxRetries=2
de.beispiel.antragsbearbeitung.service.Adresspruefung/pruefe/CircuitBreaker/delay=10000
