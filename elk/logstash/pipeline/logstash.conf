input {
  beats {
    port => 5044
  }
}

filter {
  # WildFly schreibt die Felder timestamp, level, loggerName, message, mdc und meta-data.
  # Hier werden sie auf übliche Namen gebracht, damit die Suche in Kibana einfach bleibt.
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    rename => {
      "level"                  => "[log][level]"
      "loggerName"             => "[log][logger]"
      "threadName"             => "[process][thread][name]"
      "[mdc][korrelationsId]"  => "korrelationsId"
      "[mdc][akteur]"          => "akteur"
    }
  }

  # Keine personenbezogenen Daten in den Index: bekannte Felder entfernen und Nummernmuster maskieren.
  mutate {
    remove_field => ["[mdc][name]", "[mdc][email]", "[agent]", "[ecs]", "[input]", "[log][file]", "[log][offset]", "[host]", "timestamp"]
  }
  mutate {
    gsub => ["message", "[A-Z]{2}[0-9]{2}( ?[0-9]{4}){4} ?[0-9]{2}", "[IBAN maskiert]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "antragsbearbeitung-logs-%{+YYYY.MM.dd}"
  }
}
