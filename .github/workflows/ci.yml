name: CI

# Der Runner von GitHub bringt Docker mit. Testcontainers spricht direkt mit diesem Docker,
# Docker-in-Docker ist hier nicht nötig.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit-Tests
        working-directory: app
        run: mvn -B --no-transfer-progress test
      - name: Testergebnisse anzeigen
        if: always()
        run: python3 .github/scripts/testzusammenfassung.py "Unit-Tests" app/target/surefire-reports >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Bauen und Integrationstests
        working-directory: app
        run: mvn -B --no-transfer-progress verify
      - name: Testergebnisse anzeigen
        if: always()
        run: python3 .github/scripts/testzusammenfassung.py "Integrationstests" app/target/failsafe-reports >> "$GITHUB_STEP_SUMMARY"
      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testberichte
          path: |
            app/target/surefire-reports/
            app/target/failsafe-reports/
