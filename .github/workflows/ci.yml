name: CI

# Der Runner von GitHub bringt Docker mit. Testcontainers spricht direkt mit diesem Docker,
# Docker-in-Docker ist hier nicht nötig.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit-Tests
        working-directory: app
        run: mvn -B --no-transfer-progress test

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Bauen und Integrationstests
        working-directory: app
        run: mvn -B --no-transfer-progress verify
      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: |
            app/target/surefire-reports/
            app/target/failsafe-reports/
